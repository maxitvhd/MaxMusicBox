name: Snap

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STORE_LOGIN: ${{ secrets.STORE_LOGIN }}
      MP_CLIENT_ID: ${{ secrets.MP_CLIENT_ID }}
      MP_CLIENT_SECRET: ${{ secrets.MP_CLIENT_SECRET }}
      MP_REDIRECT_URI: ${{ secrets.MP_REDIRECT_URI }}
      MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
      MP_SPLIT_PERCENT: ${{ secrets.MP_SPLIT_PERCENT }}
      MP_PAYER_EMAIL: ${{ secrets.MP_PAYER_EMAIL }}
      MP_AUTH_URL: ${{ secrets.MP_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4

      - id: snapcraft
        uses: snapcore/action-build@v1

      - uses: actions/upload-artifact@v4
        with:
          name: maxmusicbox-snap
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Publish to edge (main)
        if: startsWith(github.ref, 'refs/heads/') && env.STORE_LOGIN != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge

      - name: Publish to stable (tags)
        if: startsWith(github.ref, 'refs/tags/') && env.STORE_LOGIN != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable