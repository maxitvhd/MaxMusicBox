[package]
name = "maxmusicbox"
version = "1.0.0"
description = "MaxMusicBox - Jukebox Profissional (Tauri v2 + Rust)"
authors = ["Engenharia MaxMusicBox"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rodio = "0.19"
cpal = "0.15"
crossbeam-channel = "0.5"
lofty = "0.21"
walkdir = "2"
rustfft = "6"
ureq = { version = "2", features = ["json", "tls"] }
tiny_http = "0.12"
base64 = "0.22"
sha2 = "0.10"
urlencoding = "2"
dirs = "5"
rand = "0.8"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
