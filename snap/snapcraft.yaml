name: maxmusicbox
base: core24
version: '1.0.0'
summary: Jukebox profissional em modo quiosque com Pix via Mercado Pago
description: |
  MaxMusicBox é uma jukebox profissional para bares e eventos:
  catálogo local (MP3/FLAC/WAV/OGG/M4A), DSP em tempo real (EQ de 5 bandas,
  compressor, AGC e limiter), fila/Auto-DJ persistidos em SQLite e recarga de
  créditos via Pix com split pelo Mercado Pago.

title: MaxMusicBox
contact: mailto:maximoemsolucoes@gmail.com
issues: https://github.com/maxitvhd/MaxMusicBox/issues
source-code: https://github.com/maxitvhd/MaxMusicBox
website: https://github.com/maxitvhd/MaxMusicBox

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  maxmusicbox:
    command: bin/maxmusicbox
    extensions: [gnome]
    plugs:
      - audio-playback
      - alsa
      - home
      - network
      - network-bind
      - removable-media
    environment:
      WEBKIT_DISABLE_COMPOSITING_MODE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'

parts:
  maxmusicbox:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - pkg-config
      - libssl-dev
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libasound2-dev
      - curl
      - ca-certificates
    stage-packages:
      - libasound2t64
    override-build: |
      set -eu
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      export PATH="$HOME/.cargo/bin:$PATH"
      npm ci
      npm run build
      cargo build --release --manifest-path src-tauri/Cargo.toml
      install -Dm755 src-tauri/target/release/maxmusicbox "$SNAPCRAFT_PART_INSTALL/bin/maxmusicbox"
      mkdir -p "$SNAPCRAFT_PART_INSTALL/share/maxmusicbox"
      : > "$SNAPCRAFT_PART_INSTALL/share/maxmusicbox/.env"
      for v in MP_CLIENT_ID MP_CLIENT_SECRET MP_REDIRECT_URI MP_ACCESS_TOKEN MP_SPLIT_PERCENT MP_PAYER_EMAIL MP_AUTH_URL; do
        val="${!v:-}"
        if [ -n "$val" ]; then
          printf '%s=%s\n' "$v" "$val" >> "$SNAPCRAFT_PART_INSTALL/share/maxmusicbox/.env"
        fi
      done
